<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Information</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f4f6f8; margin:0; }
        .container { max-width:900px; margin:40px auto; padding:24px; }
        .card { background:white; padding:28px; border-radius:12px; box-shadow:0 2px 12px #0001; margin-bottom:24px; }
        h1 { margin-top:0; }
        .grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
        label { display:block; font-weight:600; margin-bottom:6px; }
        input { width:100%; box-sizing:border-box; padding:11px; border:1px solid #ccd2d8; border-radius:6px; }
        button { margin-top:18px; padding:11px 22px; border:0; border-radius:6px; cursor:pointer; }
        table { width:100%; border-collapse:collapse; }
        th,td { padding:10px; border-bottom:1px solid #eee; text-align:left; }
        .error { color:#b00020; font-size:13px; margin-top:4px; }
        @media(max-width:700px) { .grid { grid-template-columns:1fr; } }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>User Information Form</h1>
        <form th:action="@{/users}" th:object="${userInfo}" method="post">
            <div class="grid">
                <div>
                    <label>First Name</label>
                    <input type="text" th:field="*{firstName}" maxlength="50" required>
                    <div class="error" th:errors="*{firstName}"></div>
                </div>
                <div>
                    <label>Last Name</label>
                    <input type="text" th:field="*{lastName}" maxlength="50" required>
                    <div class="error" th:errors="*{lastName}"></div>
                </div>
                <div>
                    <label>Email</label>
                    <input type="email" th:field="*{email}" maxlength="120" required>
                    <div class="error" th:errors="*{email}"></div>
                </div>
                <div>
                    <label>Phone</label>
                    <input type="text" th:field="*{phone}" maxlength="20" required>
                    <div class="error" th:errors="*{phone}"></div>
                </div>
                <div>
                    <label>City</label>
                    <input type="text" th:field="*{city}" maxlength="80" required>
                    <div class="error" th:errors="*{city}"></div>
                </div>
            </div>
            <button type="submit">Save User</button>
        </form>
    </div>

    <div class="card">
        <h2>Registered Users</h2>
        <table>
            <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>City</th></tr></thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.firstName + ' ' + user.lastName}"></td>
                <td th:text="${user.email}"></td>
                <td th:text="${user.phone}"></td>
                <td th:text="${user.city}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
